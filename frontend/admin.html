<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - Sam's Fitness</title>
    
    <link rel="stylesheet" href="style.css">
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">

    <style>
        body { background: #0d0d0d; color: #fff; }
        .dashboard-container { max-width: 1100px; margin: 50px auto; padding: 40px; background: rgba(255, 255, 255, 0.05); border-radius: 10px; }
        .dashboard-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #444; padding-bottom: 20px; margin-bottom: 20px; }
        #logout-button { background: #dc3545; padding: 10px 20px; border-radius: 5px; text-decoration: none; color: #fff; cursor: pointer; border: none; }
        
        .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 20px; margin-bottom: 40px; }
        .stat-card { background-color: #E5B84B; padding: 25px; border-radius: 8px; text-align: center; }
        .stat-card h3 { font-size: 1rem; font-weight: 600; color: #4a4a4a; margin-bottom: 15px; text-transform: uppercase; }
        .stat-card p { font-size: 2.5rem; font-weight: 700; color: #1a1a1a; }
        
        .client-table { width: 100%; border-collapse: collapse; }
        .client-table th, .client-table td { padding: 12px; border-bottom: 1px solid #333; text-align: left; }
        .client-table th { background-color: rgba(255, 255, 255, 0.1); }
        .tooltip-container { position: relative; cursor: help; }
        .tooltip-text { visibility: hidden; width: 280px; background-color: #2a2a2a; color: #fff; text-align: left; border-radius: 6px; padding: 10px; position: absolute; z-index: 1; bottom: 125%; left: 50%; margin-left: -140px; opacity: 0; transition: opacity 0.3s; white-space: pre-line; box-shadow: 0 4px 8px rgba(0, 0, 0, 0.3); border: 1px solid #444; }
        .tooltip-text::after { content: ""; position: absolute; top: 100%; left: 50%; margin-left: -5px; border-width: 5px; border-style: solid; border-color: #2a2a2a transparent transparent transparent; }
        .tooltip-container:hover .tooltip-text { visibility: visible; opacity: 1; }
    </style>
</head>
<body>
    <div class="dashboard-container">
        <div class="dashboard-header">
            <h1>Admin Dashboard</h1>
            <button id="logout-button">Logout</button>
        </div>

        <div class="stats-grid">
            <div class="stat-card">
                <h3>Total Members</h3>
                <p id="total-members-stat">--</p>
            </div>
            <div class="stat-card">
                <h3>Active Subscriptions</h3>
                <p id="active-subs-stat">--</p>
            </div>
            <div class="stat-card">
                <h3>Total Reviews</h3>
                <p id="total-reviews-stat">--</p>
            </div>
        </div>
        
        <h2>Client List</h2>
        <table class="client-table">
            <thead>
                <tr>
                    <th>Name</th>
                    <th>Email</th>
                    <th>Plan</th>
                    <th>Status</th>
                    <th>Member Since</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody id="client-list-body"></tbody>
        </table>

        <h2 style="margin-top: 40px;">User Reviews</h2>
        <table class="client-table">
            <thead>
                <tr>
                    <th>Name</th>
                    <th>Email</th>
                    <th>Message</th>
                    <th>Date</th>
                </tr>
            </thead>
            <tbody id="review-list-body"></tbody>
        </table>
    </div>
    
    <script src="script.js"></script>
</body>
</html>
