<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Member Dashboard - Sam's Fitness</title>
    
    <link rel="stylesheet" href="style.css">
    
    <!-- Added FontAwesome for the Bell Icon -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">

    <style>
        body {
            background: #0d0d0d;
            color: #fff;
            font-family: 'Poppins', sans-serif;
        }
        .dashboard-container {
            max-width: 900px;
            margin: 50px auto;
            padding: 40px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 10px;
            backdrop-filter: blur(10px);
        }
        .dashboard-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #444;
            padding-bottom: 20px;
            margin-bottom: 20px;
        }
        #logout-button {
            background: #dc3545;
            padding: 10px 20px;
            border-radius: 5px;
            text-decoration: none;
            color: #fff;
            cursor: pointer;
            border: none;
            font-weight: 600;
        }
        .profile-details p {
            font-size: 1.1rem;
            line-height: 1.8;
        }
        .profile-details strong {
            color: #eee;
            margin-right: 10px;
        }
    </style>
</head>
<body>
    <div class="dashboard-container">
        <div class="dashboard-header">
            <h1 id="welcome-message">Welcome, Member!</h1>
            <button id="logout-button">Logout</button>
        </div>
        
        <div id="profile-details" class="profile-details">
            <!-- User details and subscription info will be loaded here -->
            <p>Loading your profile...</p>
        </div>

        <!-- NEW: Notification Inbox Section -->
        <div class="inbox-card">
            <div class="inbox-header">
                <h3><i class="fas fa-bell"></i> Messages</h3>
                <span class="badge" id="unread-count">0</span>
            </div>
            
            <div class="inbox-messages" id="notification-list">
                <p style="text-align:center; color:#ccc;">Loading updates...</p>
            </div>
        </div>

        <!-- Services List -->
        <div class="services-included" style="margin-top: 30px;">
            <h3 style="font-size: 1.25rem; margin-bottom: 10px;">Your Included Services:</h3>
            <ul id="client-services-list" style="list-style-type: disc; padding-left: 20px; color: #ddd;">
                <!-- Services will be loaded here by JavaScript -->
            </ul>
        </div>
    </div>
    
    <script src="script.js"></script>
</body>
</html>
